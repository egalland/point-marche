name: Review commit messages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-commit-messages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-commit-messages
  cancel-in-progress: false
jobs:
  reword:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite messages and verify contents, authors and dates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/reword.py').write_bytes(base64.b64decode(''))
          PY
          python3 /tmp/reword.py --push
